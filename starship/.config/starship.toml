"$schema" = "https://starship.rs/config-schema.json"

# Two lines, no backgrounds. Line 1: context. Line 2: prompt.
# Icons are written as \u escapes so copy/paste can't strip them.
format = """
($username$hostname )\
$directory\
$git_branch\
$git_status\
$git_state\
$c\
$cpp\
${custom.cuda}\
${custom.build_debug}\
${custom.build}\
$rust\
$python\
$conda\
$cmd_duration\
$status\
$line_break\
$jobs\
$character"""

palette = "mocha"
command_timeout = 1000   # ms; default 500 can drop CUDA on a cold nvcc
scan_timeout = 100       # ms; default 30 can miss files in big dirs

[username]
style_user = "bold sapphire"
style_root = "bold red"
format = "[$user]($style)"

[hostname]
ssh_only = true
style = "bold sapphire"
format = "[@$hostname]($style)"

[directory]
style = "lavender"
format = "[$path]($style)[$read_only]($read_only_style) "
repo_root_style = "bold lavender"
before_repo_root_style = "subtext0"
repo_root_format = "[$before_root_path]($before_repo_root_style)[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) "
truncation_length = 5
truncation_symbol = "…/"
read_only = " \U000F033E"

[git_branch]
symbol = "\uF418"
style = "mauve"
format = "[$symbol $branch]($style) "

[git_status]
style = "red"
conflicted = "=${count}"
stashed = ""
deleted = "✘${count}"
renamed = "»${count}"
modified = "!${count}"
staged = "+${count}"
untracked = "?${count}"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇡${ahead_count}⇣${behind_count}"
format = "([$all_status$ahead_behind]($style) )"

[git_state]
style = "yellow"
format = '[\($state( $progress_current/$progress_total)\)]($style) '

[c]
symbol = "\uE61E"
version_format = "${major}.${minor}"
style = "bold blue"
format = "[$symbol( $version)]($style) "

[cpp]
disabled = false
symbol = "\uE61D"
version_format = "${major}.${minor}"
style = "bold sky"
format = "[$symbol( $version)]($style) "

[custom.cuda]
when = '''
n=$(command -v nvcc || echo /usr/local/cuda/bin/nvcc)
[ -x "$n" ] || exit 1
find . -maxdepth 1 -type f \( -name '*.cu' -o -name '*.cuh' \) -print -quit 2>/dev/null | grep -q . && exit 0
[ -d src ] && find src -type f \( -name '*.cu' -o -name '*.cuh' \) -print -quit 2>/dev/null | grep -q .
'''
shell = ["sh"]
command = '''
n=$(command -v nvcc || echo /usr/local/cuda/bin/nvcc)
"$n" --version | sed -n 's/.*release \([0-9.]*\),.*/\1/p'
'''
symbol = "\uE64B"
style = "bold green"
format = "[$symbol( $output)]($style) "

# CMake build type, shown only inside a build dir (nearest CMakeCache.txt
# in the current dir or a parent). Debug or no type -> red; anything else -> grey.
[custom.build_debug]
when = true
shell = ["sh"]
command = '''
d=$PWD
until [ -f "$d/CMakeCache.txt" ]; do [ -z "$d" ] && exit 0; d=${d%/*}; done
f=$d/CMakeCache.txt
t=$(sed -n 's/^CMAKE_BUILD_TYPE:[A-Z]*=//p' "$f")
grep -q '^CMAKE_CONFIGURATION_TYPES:' "$f" && [ -z "$t" ] && exit 0
case "$t" in [Dd][Ee][Bb][Uu][Gg]) echo Debug ;; "") echo none ;; esac
'''
style = "bold red"
format = "([$output]($style) )"

[custom.build]
when = true
shell = ["sh"]
command = '''
d=$PWD
until [ -f "$d/CMakeCache.txt" ]; do [ -z "$d" ] && exit 0; d=${d%/*}; done
f=$d/CMakeCache.txt
t=$(sed -n 's/^CMAKE_BUILD_TYPE:[A-Z]*=//p' "$f")
grep -q '^CMAKE_CONFIGURATION_TYPES:' "$f" && [ -z "$t" ] && exit 0
case "$t" in [Dd][Ee][Bb][Uu][Gg]|"") ;; *) echo "$t" ;; esac
'''
style = "subtext0"
format = "([$output]($style) )"

[rust]
symbol = "\uE7A8"
version_format = "${major}.${minor}"
style = "bold peach"
format = "[$symbol( $version)]($style) "

[python]
symbol = "\uE606"
version_format = "${major}.${minor}"
style = "bold yellow"
format = '[$symbol( $version)( \($virtualenv\))]($style) '
detect_extensions = []   # show only when a virtualenv is active
detect_files = []
detect_folders = []

[conda]
symbol = "\U000F150E"
style = "bold teal"
format = "[$symbol $environment]($style) "

[cmd_duration]
style = "subtext0"
show_notifications = true    # desktop notification when a long command ends
min_time_to_notify = 45_000
format = "[\U000F051F $duration]($style) "

[status]
disabled = false
symbol = "✘"
style = "bold red"
format = "[$symbol$status( $signal_name)]($style) "

[jobs]
symbol = "✦"
style = "sapphire"
format = "[$symbol$number]($style) "

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

[palettes.mocha]
red = "#f38ba8"
yellow = "#f9e2af"
green = "#a6e3a1"
mauve = "#cba6f7"
sapphire = "#74c7ec"
lavender = "#b4befe"
peach = "#fab387"
teal = "#94e2d5"
sky = "#89dceb"
blue = "#89b4fa"
subtext0 = "#a6adc8"
